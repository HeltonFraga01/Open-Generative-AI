version: '3.8'

services:
  comfyui:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - COMFYUI_AUTH_ENABLED=true
      - COMFYUI_DEFAULT_USER=nexusmind
      # Hash bcrypt — gerar com: python3 -c "import bcrypt; print(bcrypt.hashpw(b'YOUR_PASSWORD', bcrypt.gensalt(12)).decode())"
      - "COMFYUI_DEFAULT_PASS_HASH=$$2b$$12$$YOUR_BCRYPT_HASH_HERE"
      - COMFYUI_API_TOKEN=YOUR_API_TOKEN_HERE
    ports:
      - "8188:8188"
    volumes:
      - comfyui_workspace_local:/workspace

volumes:
  comfyui_workspace_local:
