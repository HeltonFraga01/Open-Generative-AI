version: '3.8'

services:
  comfyui:
    image: ghcr.io/heltonfraga01/comfyui:v0.28.0-v12
    # ── chaves (HARDCODED diretamente na Spec YAML para resiliência no Portainer) ──
    # ATENÇÃO: NÃO extraia estas chaves para variáveis de ambiente na interface do Portainer (Stack Env).
    # Caso contrário, re-deploys de imagem apagarão as variáveis e quebrarão a criptografia/autenticação.
    environment:
      - COMFYUI_AUTH_ENABLED=true
      - COMFYUI_DEFAULT_USER=nexusmind
      # Hash bcrypt para a senha — gerar com: python3 -c "import bcrypt; print(bcrypt.hashpw(b'YOUR_PASSWORD', bcrypt.gensalt(12)).decode())"
      # $$ escape para Docker Compose (cada $ vira $$)
      - "COMFYUI_DEFAULT_PASS_HASH=$$2b$$12$$YOUR_BCRYPT_HASH_HERE"
      - COMFYUI_API_TOKEN=YOUR_API_TOKEN_HERE
      # MinIO S3 for NexusVideo image-to-video uploads (image must be publicly accessible)
      - MINIO_ENDPOINT=s3.fragaai.com.br
      - MINIO_ACCESS_KEY=YOUR_MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY=YOUR_MINIO_SECRET_KEY
      - MINIO_BUCKET=comfyui-images
      - MINIO_SECURE=true
    volumes:
      - comfyui_workspace_v5:/workspace
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.cortexx-comfyui.entrypoints=websecure"
        - "traefik.http.routers.cortexx-comfyui.rule=Host(`comfyui.nexusmind.digital`)"
        - "traefik.http.routers.cortexx-comfyui.service=cortexx-comfyui"
        - "traefik.http.routers.cortexx-comfyui.priority=200"
        - "traefik.http.routers.cortexx-comfyui.tls=true"
        - "traefik.http.routers.cortexx-comfyui.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.cortexx-comfyui.loadbalancer.server.port=8188"

volumes:
  comfyui_workspace_v5:

networks:
  network_public:
    external: true